name: Android CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  backend-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare D1 migration
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          sql = Path("backend/cloudflare/migrations/0001_initial.sql").read_text()
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          db.executescript(sql)

          expected = {
              "accounts", "devices", "device_sessions", "connection_invitations",
              "family_connections", "sharing_consents", "location_requests",
              "latest_location_fixes", "audit_events"
          }
          actual = {
              row[0] for row in db.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }
          missing = expected - actual
          assert not missing, f"Missing tables: {sorted(missing)}"
          assert not list(db.execute("PRAGMA foreign_key_check")), "Foreign key violations"
          print(f"Validated {len(expected)} D1 tables and foreign keys.")
          PY

  backend-worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Worker tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hamrahyab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
